<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | কুন্দন শৈলী</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-left"><span><i>🚚</i> Free Delivery on Orders Over ৳1000</span></div>
            <div class="top-bar-right"><a href="login.html" class="auth-link"><i>👤</i> Login</a></div>
        </div>
    </div>

    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">কু</div>
                <div class="logo-text"><h1>কুন্দন শৈলী</h1><span>Premium Glass Bangles</span></div>
            </a>
            <div class="header-actions">
                <a href="wishlist.html" class="header-action"><i>🤍</i><span class="badge wishlist-count">0</span><span>Wishlist</span></a>
                <a href="cart.html" class="header-action"><i>🛒</i><span class="badge cart-count">0</span><span>Cart</span></a>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <div class="breadcrumb-content">
            <a href="index.html">Home</a> <i>▸</i> <span>Track Order</span>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="track-form">
                <h3>Track Your Order</h3>
                <p>Enter your order ID to check the current status</p>
                <div class="track-input-group">
                    <input type="text" id="orderIdInput" placeholder="e.g. KS12345678" maxlength="10">
                    <button class="btn btn-primary" onclick="trackOrder()"><span>🔍</span> Track</button>
                </div>
            </div>

            <div id="trackingResult"></div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script>
        function trackOrder() {
            const orderId = document.getElementById('orderIdInput').value.trim();
            const result = document.getElementById('trackingResult');

            if (!orderId) {
                Toast.show('Please enter an order ID', 'error');
                return;
            }

            const order = Order.getById(orderId);

            if (!order) {
                result.innerHTML = `
                    <div class="empty-cart">
                        <div style="font-size: 3rem; margin-bottom: 15px;">📦</div>
                        <h3>Order Not Found</h3>
                        <p>We couldn't find an order with ID: ${orderId}</p>
                    </div>
                `;
                return;
            }

            result.innerHTML = `
                <div style="background: linear-gradient(145deg, var(--black-light) 0%, var(--black-lighter) 100%); border-radius: 20px; padding: 30px; border: 1px solid rgba(212, 175, 55, 0.1); margin-bottom: 40px;">
                    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <div style="color: var(--gray); font-size: 0.85rem;">Order ID</div>
                            <div style="color: var(--white); font-size: 1.2rem; font-weight: 600;">#${order.id}</div>
                        </div>
                        <div>
                            <div style="color: var(--gray); font-size: 0.85rem;">Order Date</div>
                            <div style="color: var(--white);">${new Date(order.date).toLocaleDateString()}</div>
                        </div>
                        <div>
                            <div style="color: var(--gray); font-size: 0.85rem;">Total Amount</div>
                            <div style="color: var(--gold); font-size: 1.2rem; font-weight: 700;">৳${order.total}</div>
                        </div>
                        <div>
                            <div style="color: var(--gray); font-size: 0.85rem;">Status</div>
                            <span class="status-badge status-${order.status}">${order.status}</span>
                        </div>
                    </div>
                    <div style="border-top: 1px solid rgba(212, 175, 55, 0.1); padding-top: 20px;">
                        <div style="color: var(--gray); font-size: 0.85rem; margin-bottom: 10px;">Items Ordered</div>
                        ${order.items.map(item => `
                            <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                                <div style="font-size: 1.5rem;">${item.image}</div>
                                <div>
                                    <div style="color: var(--white);">${item.name}</div>
                                    <div style="color: var(--gray); font-size: 0.85rem;">Qty: ${item.quantity} × ৳${item.price}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="tracking-timeline">
                    <div class="timeline">
                        ${order.timeline.map((t, i) => `
                            <div class="timeline-item ${t.completed ? 'completed' : i === order.timeline.findIndex(x => !x.completed) ? 'active' : 'pending'}">
                                <div class="timeline-dot"></div>
                                <div class="timeline-content">
                                    <h4>${t.status}</h4>
                                    <p>${t.description}</p>
                                    ${t.time ? `<span>${t.time}</span>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Auto-track if ID in URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        if (orderId) {
            document.getElementById('orderIdInput').value = orderId;
            trackOrder();
        }
    </script>
</body>
</html>
