<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | কুন্দন শৈলী</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-left"><span><i>🚚</i> Free Delivery on Orders Over ৳1000</span></div>
            <div class="top-bar-right"><a href="login.html" class="auth-link"><i>👤</i> Login</a></div>
        </div>
    </div>

    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">কু</div>
                <div class="logo-text"><h1>কুন্দন শৈলী</h1><span>Premium Glass Bangles</span></div>
            </a>
            <div class="header-actions">
                <a href="wishlist.html" class="header-action"><i>🤍</i><span class="badge wishlist-count">0</span><span>Wishlist</span></a>
                <a href="cart.html" class="header-action"><i>🛒</i><span class="badge cart-count">0</span><span>Cart</span></a>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <div class="breadcrumb-content">
            <a href="index.html">Home</a> <i>▸</i> <span>Wishlist</span>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="section-header">
                <h2>My Wishlist</h2>
                <p>Your favorite items saved for later</p>
            </div>
            <div id="wishlistContainer"></div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script>
        function renderWishlist() {
            const wishlist = Wishlist.get();
            const container = document.getElementById('wishlistContainer');

            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div style="font-size: 4rem; margin-bottom: 20px;">🤍</div>
                        <h3>Your wishlist is empty</h3>
                        <p>Save items you love to your wishlist.</p>
                        <a href="shop.html" class="btn btn-primary" style="margin-top: 20px;">Explore Products</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `<div class="wishlist-grid">${wishlist.map(item => `
                <div class="wishlist-item">
                    <button class="remove-wishlist" onclick="removeFromWishlist(${item.id})" title="Remove">✕</button>
                    ${Render.productCard(item)}
                </div>
            `).join('')}</div>`;
            attachProductListeners();
        }

        function removeFromWishlist(id) {
            const product = products.find(p => p.id === id);
            Wishlist.toggle(product);
            renderWishlist();
            Wishlist.updateUI();
        }

        renderWishlist();
    </script>
</body>
</html>
