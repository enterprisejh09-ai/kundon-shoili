<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | কুন্দন শৈলী</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="top-bar-left">
                <span><i>🚚</i> Free Delivery on Orders Over ৳1000</span>
            </div>
            <div class="top-bar-right">
                <a href="login.html" class="auth-link"><i>👤</i> Login</a>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">কু</div>
                <div class="logo-text"><h1>কুন্দন শৈলী</h1><span>Premium Glass Bangles</span></div>
            </a>
            <div class="header-actions">
                <a href="wishlist.html" class="header-action"><i>🤍</i><span class="badge wishlist-count">0</span><span>Wishlist</span></a>
                <a href="cart.html" class="header-action"><i>🛒</i><span class="badge cart-count">0</span><span>Cart</span></a>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <div class="breadcrumb-content">
            <a href="index.html">Home</a> <i>▸</i> <span>Shopping Cart</span>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="section-header">
                <h2>Shopping Cart</h2>
                <p>Review your items and proceed to checkout</p>
            </div>
            <div class="cart-layout" id="cartContainer">
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-summary" id="cartSummary"></div>
            </div>
        </div>
    </section>

    <footer class="footer" style="padding: 40px 0 20px;">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>© 2026 কুন্দন শৈলী. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <a href="https://wa.me/8801234567890" class="whatsapp-float" target="_blank">💬</a>
    <script src="js/main.js"></script>
    <script>
        function renderCart() {
            const cart = Cart.get();
            const cartItems = document.getElementById('cartItems');
            const cartSummary = document.getElementById('cartSummary');

            if (cart.length === 0) {
                document.getElementById('cartContainer').innerHTML = `
                    <div class="empty-cart" style="grid-column: 1 / -1;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Looks like you haven't added any items yet.</p>
                        <a href="shop.html" class="btn btn-primary" style="margin-top: 20px;">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image"><div style="font-size: 3rem;">${item.image}</div></div>
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>Color: ${item.color || 'Default'} | Size: ${item.size || 'Standard'}</p>
                        <div class="quantity-selector" style="margin-top: 10px;">
                            <button onclick="Cart.updateQuantity(${item.cartId}, ${item.quantity - 1})">−</button>
                            <input type="text" value="${item.quantity}" readonly>
                            <button onclick="Cart.updateQuantity(${item.cartId}, ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <div class="cart-item-price">
                        <span class="current">৳${item.price * item.quantity}</span>
                        <button class="remove-btn" onclick="Cart.remove(${item.cartId})"><span>🗑</span> Remove</button>
                    </div>
                </div>
            `).join('');

            const subtotal = Cart.getTotal();
            const shipping = subtotal >= 1000 ? 0 : 60;
            const total = subtotal + shipping;

            cartSummary.innerHTML = `
                <h3>Order Summary</h3>
                <div class="summary-row"><span>Subtotal</span><span>৳${subtotal}</span></div>
                <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : '৳' + shipping}</span></div>
                <div class="coupon-input">
                    <input type="text" id="couponCode" placeholder="Enter coupon code">
                    <button class="btn btn-sm btn-dark" onclick="applyCoupon()">Apply</button>
                </div>
                <div id="discountRow" style="display: none;" class="summary-row"><span>Discount</span><span style="color: #27ae60;" id="discountAmount">-৳0</span></div>
                <div class="summary-row total"><span>Total</span><span id="cartTotal">৳${total}</span></div>
                <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top: 20px;"><span>✓</span> Proceed to Checkout</a>
                <a href="shop.html" class="btn btn-outline btn-block" style="margin-top: 10px;">Continue Shopping</a>
            `;
        }

        let appliedDiscount = 0;
        function applyCoupon() {
            const code = document.getElementById('couponCode').value;
            const subtotal = Cart.getTotal();
            const result = Coupon.apply(code, subtotal);
            if (result.valid) {
                appliedDiscount = subtotal - result.newTotal;
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discountAmount').textContent = '-৳' + appliedDiscount;
                document.getElementById('cartTotal').textContent = '৳' + result.newTotal;
                Toast.show(`Coupon applied! ${result.discount}% off`, 'success');
            } else {
                Toast.show('Invalid coupon code!', 'error');
            }
        }

        renderCart();
    </script>
</body>
</html>
